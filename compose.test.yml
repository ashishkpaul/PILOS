services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: pilos_int_test_only
      MARIADB_DATABASE: testing
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
